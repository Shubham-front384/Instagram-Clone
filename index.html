<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./Img/logo.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <title>Instagram</title>
</head>
<body>
  
  <main>
    <!-- top part -->
    <section class="top">
      <div class="instagram-logo">
        <div class="logo">
          <img src="./Img/instagramName.png" alt="instagramName">
        </div>
        <i class="ri-arrow-down-wide-line arrow"></i>
      </div>
      <div class="instagram-like">
        <i class="ri-add-line add"></i>
        <i class="ri-heart-3-line heart"></i>
      </div>
    </section>

    <!-- main content -->
    <section class="main-content">
      <h1>Right now only reel section is on</h1>
    </section>

    <!-- bottom part -->
    <section class="bottom">
      <ul class="bottom-icons">
        <li id="home">
          <a href="./index.html">
            <i class="ri-home-5-fill"></i>
          </a>
        </li>
        <li id="search">
          <a href="#">
            <i class="ri-search-line"></i>
          </a>
        </li>
        <li id="reel">
          <a href="./reel.html">
            <i class="ri-play-mini-fill"></i>
          </a>
        </li>
        <li id="message">
          <a href="#">
            <i class="ri-send-plane-fill"></i>
          </a>
        </li>
        <li id="profile">
          <a href="#">
            <i class="ri-account-circle-fill"></i>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
